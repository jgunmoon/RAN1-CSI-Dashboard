# RAN1 CSI 대시보드: 매일 자동 실행 + 수동 실행
# 원본 트래커(jgunmoon/RAN1-Decision-Tracker)는 매일 23:47 UTC(KST 08:47)에 DB를 갱신합니다.
# 그 실행이 늦거나 오래 걸려도 새 DB를 읽도록 01:17 UTC(KST 10:17)에 실행합니다 (정각은 GitHub 실행이 몰려 피함).
# 바로 확인하려면 GitHub 저장소 → Actions → "RAN1 CSI dashboard" → "Run workflow"를 누릅니다.
# 원본 DB를 읽어 reports/를 다시 만들고, 바뀐 것이 있으면 커밋한 뒤 reports/를 GitHub Pages로 게시합니다.
# GitHub은 저장소에 60일 동안 활동이 없으면 예약 실행을 멈춥니다. 멈췄다는 메일이 오면 Actions에서 다시 켭니다.
name: RAN1 CSI dashboard

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 갱신된 reports/를 커밋하기 위해 필요
  issues: write     # 결과가 달라지면 알림 Issue를 만들기 위해 필요

concurrency:
  group: csi-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium   # 화면 동작 테스트(tests/test_browser.py)용 브라우저

      - name: Test
        env:
          REQUIRE_BROWSER_TEST: "1"   # 브라우저가 없으면 건너뛰지 않고 실패
        run: python -m pytest -q

      - name: Build reports from the source DB
        shell: bash   # -eo pipefail: tee 뒤에 가려져도 스크립트 오류면 실패로 표시
        run: python -m scripts.build --notify-file "$RUNNER_TEMP/notify.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit updated reports
        run: |
          if git diff --quiet -- reports && [ -z "$(git ls-files --others --exclude-standard reports)" ]; then
            echo "변경 없음 — 커밋하지 않습니다." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          git commit -m "Update CSI dashboard reports"
          git push

      # 결과가 달라졌으면(새 회의, 과거 회의 추가·변경·삭제, Agenda 경고) Issue로 알립니다. 첫 줄이 제목입니다.
      # 리포트 커밋 뒤에 만들고 continue-on-error라, Issue 생성이 실패해도(예: Issues 꺼짐) 리포트·Pages는 갱신됩니다.
      # 실패하면 실행 화면에 경고(주황색)로 남습니다.
      - name: Open notification issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/notify.md"
          if [ ! -s "$f" ]; then echo "알림 없음 (결과 변화 없음)"; exit 0; fi
          title=$(head -n 1 "$f")
          tail -n +3 "$f" > "$RUNNER_TEMP/notify_body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/notify_body.md"
          echo "알림 Issue 생성: $title" | tee -a "$GITHUB_STEP_SUMMARY"

  # reports/ 폴더를 GitHub Pages로 게시합니다 (Settings → Pages → Source: GitHub Actions 필요).
  pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # build 작업이 방금 커밋한 최신 리포트를 받기 위해 브랜치 최신 상태로

      # 대시보드 맨 위의 '마지막 확인' 시각을 이번 실행 시각(한국시간)으로 채웁니다. 저장소에는 커밋하지 않습니다.
      - name: Stamp last check time
        run: |
          now=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          sed -i "s|<span class=\"checked\" hidden>__CHECKED_AT__</span>|<span class=\"checked\"> · 마지막 확인 <b>${now}</b></span>|" reports/index.html
          grep -q "마지막 확인 <b>${now}</b>" reports/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: reports

      - id: deploy
        uses: actions/deploy-pages@v4
