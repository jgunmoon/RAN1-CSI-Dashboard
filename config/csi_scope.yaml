# RAN1 CSI 대시보드 설정
#
# 원본 DB(jgunmoon/RAN1-Decision-Tracker)의 결정 중 CSI 관련만 골라 보여줍니다.
# 범위와 주제 분류는 모두 이 파일에서 정합니다. 코드를 고칠 필요가 없습니다.
# 이 파일을 고친 뒤 `python -m scripts.build`를 실행하면 reports/가 다시 만들어집니다.

# ── 데이터 소스 (읽기만 함) ────────────────────────────────────────────
source:
  repo: "jgunmoon/RAN1-Decision-Tracker"
  branch: "ccr-0c6b397f-j6xur9"     # 원본 저장소의 기본 브랜치. 바뀌면 여기만 고칩니다.
  db_path: "data/agreements_db.json"

# 이 저장소의 주소. 저장소나 기본 브랜치 이름이 바뀌면 함께 고칩니다.
report_base_url: "https://github.com/jgunmoon/RAN1-CSI-Dashboard/blob/main/reports/"   # HTML → 주제별 마크다운 리포트 링크
dashboard_url: "https://jgunmoon.github.io/RAN1-CSI-Dashboard/"                                         # README → HTML 대시보드 링크

# ── 1. 포함 Agenda (확정) ────────────────────────────────────────────
# Agenda 번호는 회의마다 바뀌므로 '섹션(최상위 Agenda) 제목 + Agenda 제목'으로 찾습니다.
#   section : 최상위 Agenda 제목 (대소문자·공백·따옴표 모양은 무시)
#   (section·path의 제목이 're:'로 시작하면 정규식입니다. 대소문자 무시, 제목 전체 일치. 다음 Phase·Release Agenda를 미리 잡을 때 씁니다.)
#   path    : 섹션 아래 Agenda 제목. 여러 개면 위에서 아래로 이어진 경로입니다.
#             경로 중간부터 적어도 됩니다 (예: [CSI acquisition and report, Other aspects]).
#   children: true면 그 Agenda 아래 하위 Agenda 결정까지 모두 포함합니다.
#   topic   : 이 Agenda 결정의 주제를 고정합니다. 비우면 아래 topics 규칙으로 결정마다 나눕니다.
#   label   : 대시보드에 보일 이름 (비우면 path의 마지막 제목)
agendas:
  # Rel-20 6GR Study
  - {section: "Rel-20 Study of 6GR", path: ["Aspects of downlink-based CSI acquisition"]}
  - {section: "Rel-20 Study of 6GR", path: ["Aspects of uplink-based CSI acquisition"], topic: srs}
  # #124~#125는 'MIMO operation' 아래, #126부터는 'CSI acquisition and report' 아래에 있었습니다. 제목으로 매칭하므로 둘 다 잡힙니다.
  - {section: "Rel-20 Study of 6GR", path: ["Beam management for downlink and uplink"], topic: beam}
  - {section: "Rel-20 Study of 6GR", path: ["Synchronization acquisition and beam measurement"], topic: beam}
  - {section: "Rel-20 Study of 6GR", path: ["CSI acquisition and report", "Other aspects"], label: "CSI acquisition and report: Other aspects (TRS, DL+UL 결합 CSI 등)"}
  # Rel-20 NR
  - {section: "Release 20 NR", path: ["NR MIMO Phase 6"], label: "NR MIMO Phase 6 (상위 Agenda)"}
  - {section: "Release 20 NR", path: ["Enhancing DL CSI acquisition"]}
  - {section: "Release 20 NR", path: ["Improvement of SRS capacity and coverage"], topic: srs}
  - {section: "Release 20 NR", path: ["CSI spatial/frequency compression without temporal aspects (\"Case 0\")"], children: true, topic: aiml,
     label: "AI/ML CSI compression Case 0 (Inference related aspects 등 하위 포함)"}
  - {section: "Release 20 NR", path: ["Inter-vendor training collaboration for two-sided AI/ML models"], topic: aiml}
  # Rel-19
  # 정규식: 지금은 Rel-19 Phase 5만 있고, 앞으로 생길 'Rel-20 UE Features > UE features for NR MIMO Phase 6' 등도 자동으로 잡습니다.
  - {section: "re:Rel-\\d+ UE Features", path: ["re:UE features for NR MIMO Phase \\d+"], label: "UE features for NR MIMO Phase N"}
  - {section: "re:Maintenance on Rel-\\d+ NR and E-UTRA", path: ["re:Maintenance on NR MIMO Phase \\d+"], children: true,
     label: "Maintenance on NR MIMO Phase N (하위 포함)"}
  - {section: "Maintenance on Rel-19 NR and E-UTRA", path: ["Specification support for beam management"], topic: aiml,
     label: "AI/ML: Specification support for beam management"}
  - {section: "Maintenance on Rel-19 NR and E-UTRA", path: ["Specification support for CSI prediction"], topic: aiml,
     label: "AI/ML: Specification support for CSI prediction"}

# ── 2. 보조 키워드 (후보) ────────────────────────────────────────────
# 위 Agenda 밖에서 이 키워드가 결정 원문(또는 FFS 줄)에 있으면 '후보'로 따로 표시합니다.
# 정규식이며 대소문자를 구분합니다 ((?i)를 앞에 붙이면 구분 안 함).
candidate_keywords:
  - '\bCSI-RS\b'
  - '(?i)\bCSI[- ]report'
  - '(?i)\bCSI feedback'
  - '(?i)\bCSI acquisition'
  - '(?i)\bCSI prediction'
  - '(?i)\bCSI compression'
  - '(?i)codebook'
  - '\bPMI\b'
  - '\bCQI\b'
  - '\bTCI\b'
  - '(?i)beam failure'
  - '\bBF[DR]\b'
  - '(?i)beam report'
  - '(?i)beamforming'
  - '(?i)beam management'
  - '\bL1-RSRP\b'
  - '\bSRS\b'

# 키워드·주제 판정 전에 원문에서 지우는 표현 (CSI와 무관한 같은 단어)
ignore_phrases:
  - '(?i)HARQ-ACK codebook'
  - '(?i)HARQ codebook'
  - '(?i)Type-[123] HARQ(-ACK)? codebook'

# ── 2-1. 사양 조항 번호 (후보) ─────────────────────────────────────────
# 유지보수 결정은 "The following TP for TS 38.214 Clause 5.2.5 is endorsed"처럼 본문이 TDoc에 있어
# 기술 키워드 없이 사양 조항 번호만 나오는 경우가 많습니다. 그래서 조항 번호도 키워드처럼 씁니다.
#   - 같은 줄에 사양 번호(TS 38.214 등)와 조항 번호(Clause/Section 5.2.5, 또는 'TS38.214 5.2.5')가 함께 나오면 일치로 봅니다.
#     한 줄에 사양이 여럿이면 조항 번호와 가장 가까운 사양에 붙입니다. 'Section 2 of R1-xxxx'처럼 TDoc의 절은 제외합니다.
#   - clause는 그 조항과 모든 하위 조항을 포함합니다 (5.2 → 5.2, 5.2.1.4.6 …). exact: true면 그 조항 번호만 봅니다.
#   - 포함 Agenda 밖에서 일치하면 '후보'가 되고, topic은 그 결정의 '관련 주제' 태그로 붙습니다.
spec_clauses:
  - {spec: "38.214", clause: "5.1.5",     topic: beam,   note: "Antenna ports quasi co-location (TCI)"}
  - {spec: "38.214", clause: "5.1.6.1",   topic: csirs,  note: "CSI-RS reception (TRS, L1-RSRP용 CSI-RS)"}
  - {spec: "38.214", clause: "5.2",       topic: report, note: "UE procedure for reporting CSI"}
  - {spec: "38.214", clause: "6.2.1",     topic: srs,    note: "UE sounding procedure (SRS)"}
  # Link recovery는 하위 조항 없이 '6'으로 인용됩니다. 원문의 '38.213 6.3.2.x'는 실제로는 38.212 UCI 조항이라 exact로 막습니다.
  - {spec: "38.213", clause: "6",         topic: beam,   note: "Link recovery procedures (beam failure)", exact: true}
  - {spec: "38.212", clause: "6.3.1.1.2", topic: report, note: "UCI on PUCCH: CSI"}
  - {spec: "38.212", clause: "6.3.2.1.2", topic: report, note: "UCI on PUSCH: CSI"}

# ── 3. 수동 목록 (결정 id 기준, 예: "RAN1#126:9.1.1:001") ──────────────
include_ids: []   # 후보나 범위 밖 결정을 확정 범위로 올림
exclude_ids: []   # 확정·후보 어디에서도 뺌

# ── 4. 주제 분류 ─────────────────────────────────────────────────────
# 결정마다 '주된 주제' 하나와 '관련 주제' 태그(여러 개)가 붙습니다.
#   주된 주제: Agenda에 topic이 있으면 그것, 없으면 위에서부터 patterns가 맞는 첫 주제, 그다음 조항 번호(spec_clauses)의 topic,
#             아무것도 없으면 fallback_topic. 차트와 표의 기본 숫자는 주된 주제로 셉니다(합계 = 전체 건수).
#   관련 주제: 주된 주제 + patterns가 맞는 모든 주제 + 일치한 조항 번호의 topic. 결정 목록의 '관련 포함' 주제 필터와
#             표의 '관련 포함' 열이 이것을 씁니다(한 결정이 여러 주제에 들어가므로 합계가 전체보다 큼).
# 순서를 바꾸면 주된 주제가 바뀝니다. 색은 대시보드 차트에서 이 순서대로 정해집니다.
topics:
  - id: aiml
    label: "AI/ML CSI"
    patterns: ['AI/ML', '(?i)two-sided', '(?i)\bCSI prediction', '(?i)\bmodel (ID|identification|training|inference)', '(?i)\bdataset']
  - id: srs
    label: "SRS"
    patterns: ['\bSRS\b']
  - id: beam
    label: "Beam management"
    patterns: ['\bTCI\b', '(?i)beam failure', '\bBF[DR]\b', '(?i)beam (report|management|measurement|indication)', '\bL1-RSRP\b', '\bL1-SINR\b', '\bUEIBM\b', '(?i)beamforming']
  - id: report
    label: "CSI 보고/codebook"
    patterns: ['(?i)\bCSI[- ]report', 'reportQuantity', '(?i)\bCSI feedback', '(?i)codebook', '\bPMI\b', '\bCQI\b', '\bRI\b', '\bType[- ]?I{1,2}\b', '\bCPU\b', '\bCSI\b(?!-RS|-IM)']
  - id: csirs
    label: "CSI-RS"
    patterns: ['\bCSI-RS\b', '\bNZP\b', '\bCSI-IM\b', '\bTRS\b', '(?i)tracking RS', '(?i)\bRS for (finer )?time/frequency tracking', '\bCMR\b', '\bIMR\b']
fallback_topic: {id: other, label: "기타 CSI"}

# ── 5. 알림 ─────────────────────────────────────────────────────────
# 결과가 달라진 실행(새 회의, 과거 회의 추가·변경·삭제, 범위 설정 변경)마다 GitHub Issue를 하나 만듭니다.
# 저장소를 Watch(All Activity 또는 Custom → Issues)한 사람에게 메일이 갑니다.
# mentions에 GitHub 아이디를 적으면 Watch하지 않아도 Issue에서 @멘션으로 알림을 받습니다. 예: ["jgunmoon"]
notify:
  issue: true
  mentions: []

# HTML 대시보드 검색창의 추천 검색어 ('|' 또는 대문자 OR로 여러 표기를 함께 찾음)
search_presets: ["CSI-RS", "codebook | PMI", "CQI", "TCI", "beam failure | BFR", "SRS", "two-sided", "CSI prediction"]
